<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f1e9">
<title>ATELIER TOUNGARA — Des idées qui prennent forme</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{
 --paper:#f4f1e9;--white:#fffefa;--ink:#202820;--muted:#73796f;--line:#deded3;
 --green:#254f3d;--green2:#dce8dc;--orange:#d76b43;--yellow:#e7c96a;
 --shadow:0 18px 45px rgba(31,44,34,.09);
 --type-word:#2b579a;--type-ppt:#c43e1c;--type-excel:#1e7145;--type-vba:#6b3fa0;--type-python:#306998;
}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}
.wrap{width:min(1160px,calc(100% - 48px));margin:auto}
.announcement{background:var(--green);color:#f8f5eb;font:10px 'DM Mono',monospace;letter-spacing:.07em}
.announcement .wrap{display:flex;justify-content:space-between;gap:15px;padding:9px 0}
.announcement b{color:var(--yellow);font-weight:500}
header{position:sticky;top:0;z-index:20;background:rgba(244,241,233,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(32,40,32,.1)}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;font:800 15px Manrope,sans-serif;letter-spacing:-.04em}
.brandmark{height:38px;width:38px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--yellow);font:700 13px 'DM Mono',monospace}
.brand small{display:block;font:9px 'DM Mono',monospace;letter-spacing:.14em;color:var(--muted);margin-top:1px}
.navlinks{display:flex;gap:30px;align-items:center;color:#555e53;font-size:12px;font-weight:600}
.navlinks a{position:relative}.navlinks a:after{content:"";position:absolute;left:0;bottom:-7px;width:0;height:1px;background:var(--orange);transition:width .25s}
.navlinks a:hover:after{width:100%}
.navbutton,.button{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--green);border-radius:999px;padding:12px 18px;font-size:12px;font-weight:700;transition:transform .2s,background .2s,color .2s;cursor:pointer}
.navbutton,.button.dark{background:var(--green);color:#fffefa}
.navbutton:hover,.button:hover{transform:translateY(-2px)}
.button.outline{background:transparent;color:var(--ink);border-color:#aeb5a8}
.button .arrow{font-size:16px;line-height:0;transition:transform .2s}.button:hover .arrow{transform:translateX(4px)}
.hero{padding:86px 0 76px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-120px;top:20px;width:480px;height:480px;border:1px solid #d8d9cd;border-radius:50%;box-shadow:0 0 0 50px rgba(37,79,61,.025),0 0 0 100px rgba(37,79,61,.02);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:70px;align-items:center;position:relative;z-index:1}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--green);font:10px 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.eyebrow:before{content:"";width:26px;height:1px;background:var(--orange)}
h1,h2,h3,p{margin-top:0}
h1{font:600 clamp(44px,5.7vw,72px)/1.03 Manrope,sans-serif;letter-spacing:-.075em;max-width:670px;margin:22px 0}
h1 em{font-style:normal;color:var(--orange)}
.hero-copy{max-width:500px;color:#626b60;font-size:16px;line-height:1.85}
.hero-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:28px}
.hero-note{margin-top:38px;display:flex;gap:13px;align-items:center;color:var(--muted);font-size:11px}
.avatar-stack{display:flex;padding-left:5px}.avatar-stack span{width:26px;height:26px;border:2px solid var(--paper);border-radius:50%;margin-left:-6px;background:#d7a88e;display:grid;place-items:center;font-size:9px;color:#fff}.avatar-stack span:nth-child(2){background:#68846d}.avatar-stack span:nth-child(3){background:#c48b50}
.artboard{position:relative;min-height:390px;display:flex;align-items:center;justify-content:center}
.paper-card{position:relative;width:min(100%,420px);background:var(--white);border:1px solid #e4e1d7;border-radius:8px;padding:24px;box-shadow:0 24px 55px rgba(42,51,40,.12);transform:rotate(2deg);animation:float 7s ease-in-out infinite}
.paper-card:before{content:"";position:absolute;inset:9px -9px -9px 9px;border:1px solid #c9cfc2;border-radius:8px;z-index:-1}
.card-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:15px;border-bottom:1px solid var(--line);font:9px 'DM Mono',monospace;letter-spacing:.1em;color:var(--muted)}
.stamp{background:var(--green2);color:var(--green);padding:5px 8px;border-radius:3px;font-size:8px}
.paper-card h3{font:600 25px/1.1 Manrope,sans-serif;letter-spacing:-.06em;margin:24px 0 6px}
.paper-card .small{font-size:11px;color:var(--muted)}
.chart{height:105px;display:flex;align-items:end;gap:9px;border-bottom:1px solid var(--line);padding:0 7px 0;margin:25px 0 18px}
.chart i{display:block;flex:1;background:#cdd9c9;border-radius:3px 3px 0 0;transform-origin:bottom;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
.chart i:nth-child(1){height:30%;animation-delay:.1s}.chart i:nth-child(2){height:54%;animation-delay:.2s}.chart i:nth-child(3){height:42%;animation-delay:.3s}.chart i:nth-child(4){height:78%;animation-delay:.4s}.chart i:nth-child(5){height:63%;animation-delay:.5s}.chart i:nth-child(6){height:91%;background:var(--orange);animation-delay:.6s}
.paper-bottom{display:flex;justify-content:space-between;gap:10px}
.paper-bottom div{background:#f2f1e9;padding:10px 12px;flex:1}
.paper-bottom small{display:block;color:var(--muted);font:8px 'DM Mono',monospace;letter-spacing:.08em}
.paper-bottom b{font:600 13px Manrope,sans-serif}
.side-note{position:absolute;right:-5px;bottom:28px;background:var(--yellow);padding:14px 17px;box-shadow:0 12px 25px #6d5a2225;transform:rotate(-5deg);font:10px 'DM Mono',monospace;animation:note 5s ease-in-out infinite}
.side-note b{display:block;font:700 17px Manrope,sans-serif}
@keyframes float{0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes note{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(-3deg)}}
@keyframes grow{from{transform:scaleY(.05);opacity:.4}to{transform:scaleY(1);opacity:1}}
.intro-strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0}
.strip-inner{display:flex;justify-content:space-between;align-items:center;gap:20px}
.strip-inner p{margin:0;color:var(--muted);font-size:11px}.strip-inner strong{font:600 12px Manrope,sans-serif}
.section{padding:82px 0}.section.light{background:var(--white)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:30px}
.kicker{color:var(--orange);font:10px 'DM Mono',monospace;letter-spacing:.15em;text-transform:uppercase}
h2{font:600 clamp(32px,4vw,47px)/1.1 Manrope,sans-serif;letter-spacing:-.065em;margin:10px 0 0}
.section-desc{max-width:430px;color:var(--muted);font-size:13px;line-height:1.8;margin:0}
.catalog-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:27px 0 22px}
.searchbox{flex:1;min-width:220px;position:relative}
.searchbox span{position:absolute;left:15px;top:10px;color:var(--muted);font-size:18px}
.searchbox input{width:100%;border:1px solid var(--line);border-radius:999px;padding:12px 16px 12px 42px;background:transparent;outline:none;font-size:12px}
.searchbox input:focus{border-color:var(--green);box-shadow:0 0 0 3px #254f3d12}
.filter{border:1px solid var(--line);background:transparent;border-radius:999px;padding:11px 15px;color:#626b60;font-size:11px;cursor:pointer;transition:.2s}
.filter:hover{border-color:var(--green);color:var(--green)}.filter.active{background:var(--green);color:white;border-color:var(--green)}

/* -------- Cartes publiques enrichies -------- */
.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.project{background:var(--white);border:1px solid #e7e5dc;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s,border-color .3s;cursor:pointer;position:relative}
.project:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:#d1d7cc}
.project-cover{height:180px;background:#e5ebe0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.project-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.project:hover .project-cover img{transform:scale(1.05)}
.project-cover .fallback{font:700 40px Manrope,sans-serif;color:#fff;opacity:.35}
.project-cover .video-badge{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;padding:4px 9px;border-radius:20px;font:10px 'DM Mono',monospace;display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px)}
.project-cover .video-badge:before{content:"▶";font-size:8px}
.type-badge{position:absolute;left:10px;top:10px;padding:5px 10px;border-radius:5px;font:700 9px 'DM Mono',monospace;letter-spacing:.06em;color:#fff;text-transform:uppercase}
.type-badge.word{background:var(--type-word)}
.type-badge.ppt{background:var(--type-ppt)}
.type-badge.excel{background:var(--type-excel)}
.type-badge.vba{background:var(--type-vba)}
.type-badge.python{background:var(--type-python)}
.type-badge.autre{background:#5a6157}
.project-content{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.project-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font:9px 'DM Mono',monospace;letter-spacing:.04em}
.status{padding:4px 8px;border-radius:2px;background:#f4eadc;color:#94613d;white-space:nowrap}
.status.dev{background:#e7ede4;color:var(--green)}
.status.dispo{background:#dcefe2;color:#1e7145}
.project h3{font:650 16px/1.3 Manrope,sans-serif;letter-spacing:-.03em;margin:12px 0 6px}
.project p{color:#73796f;font-size:11px;line-height:1.7;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.project-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.project-tags span{background:#f0f0e9;color:#596257;padding:3px 7px;border-radius:3px;font:9px 'DM Mono',monospace}
.project-foot{margin-top:auto;border-top:1px solid #eeede6;padding-top:11px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted)}
.project-foot .see{color:var(--green);font-weight:700;display:flex;align-items:center;gap:4px}
.project-foot .see span{transition:transform .2s}
.project:hover .project-foot .see span{transform:translate(3px,-3px)}
.level-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;padding:3px 7px;border-radius:3px;background:#eef1e9;color:#4a5a4a}
.level-badge.deb{background:#e3f0e5;color:#2b6b40}
.level-badge.av{background:#f7e5d8;color:#a04c1f}
.empty{display:none;grid-column:1/-1;padding:38px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:13px}
.disclaimer{font:10px 'DM Mono',monospace;color:#878d82;margin-top:16px;line-height:1.7}

/* -------- Modal détail projet -------- */
.detail-overlay{position:fixed;inset:0;z-index:70;background:rgba(18,28,21,.78);backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.detail-overlay.open{display:flex}
.detail-modal{background:var(--paper);border-radius:18px;width:min(1000px,100%);margin:auto;overflow:hidden;box-shadow:0 30px 100px #0006;animation:panelIn .3s ease}
.detail-hero{height:300px;background:#e5ebe0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-hero video,.detail-hero iframe{width:100%;height:100%;object-fit:contain;background:#000}
.detail-close{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.95);font-size:22px;cursor:pointer;z-index:2;box-shadow:0 4px 12px #0003}
.detail-body{padding:28px clamp(20px,3vw,38px) 34px}
.detail-body h2{font-size:clamp(24px,3.5vw,34px);letter-spacing:-.05em;margin:8px 0 12px}
.detail-body .description{color:#596257;font-size:14px;line-height:1.8;margin-bottom:20px}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:20px 0 24px}
.detail-info{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.detail-info small{display:block;font:9px 'DM Mono',monospace;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.detail-info b{font:600 13px Manrope,sans-serif;color:var(--ink)}
.detail-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:20px 0}
.detail-gallery img{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;transition:transform .2s}
.detail-gallery img:hover{transform:scale(1.03)}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.detail-actions .button{padding:13px 22px;font-size:13px}
.detail-actions .price{font:700 18px Manrope,sans-serif;color:var(--green);display:flex;align-items:center;margin-right:auto}

/* -------- Admin -------- */
.admin-entry{display:block;border:0;background:none;padding:0;margin-top:10px;color:#aeb5a8;font:11px 'DM Sans',sans-serif;cursor:pointer}
.admin-entry:hover{color:var(--yellow)}
.admin-overlay{position:fixed;inset:0;z-index:60;background:rgba(18,28,21,.68);backdrop-filter:blur(7px);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
.admin-overlay.open{display:flex;animation:fadeIn .2s ease}
.admin-panel{width:min(1180px,100%);margin:auto;background:var(--paper);border-radius:18px;padding:clamp(20px,4vw,38px);box-shadow:0 30px 90px #0004;animation:panelIn .28s ease}
.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.admin-head h2{margin:7px 0;font-size:clamp(28px,4vw,40px)}
.admin-head p{color:var(--muted);font-size:13px}
.admin-close{border:1px solid var(--line);background:white;border-radius:50%;width:40px;height:40px;font-size:25px;cursor:pointer;flex:none}
.admin-notice{background:#f1e8d5;border-left:3px solid var(--orange);padding:13px 15px;font-size:11px;color:#665a45;margin:15px 0 25px;line-height:1.7}
.admin-columns{display:grid;grid-template-columns:1.15fr .85fr;gap:22px}
.admin-form,.admin-list{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:20px}
.admin-form h3,.admin-list h3{font:700 17px Manrope,sans-serif;margin:0 0 16px}
.admin-form label{display:block;font-size:11px;font-weight:700;color:#596257;margin:12px 0}
.admin-form input,.admin-form textarea,.admin-form select{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:#fffefa;color:var(--ink);font:12px 'DM Sans',sans-serif;outline:none}
.admin-form input:focus,.admin-form textarea:focus,.admin-form select:focus{border-color:var(--green);box-shadow:0 0 0 3px #254f3d12}
.admin-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.admin-list-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.admin-list-head span{font:10px 'DM Mono',monospace;color:var(--muted)}
.admin-project{border-top:1px solid var(--line);padding:11px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.admin-project-thumb{width:48px;height:48px;border-radius:6px;object-fit:cover;background:#eef1e9;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px}
.admin-project-main{flex:1;min-width:0}
.admin-project strong{display:block;font:600 13px Manrope,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-project small{color:var(--muted);font-size:10px}
.admin-project-actions{display:flex;gap:5px;flex:none}
.admin-project-actions button{border:1px solid var(--line);border-radius:30px;background:white;padding:6px 9px;font-size:10px;cursor:pointer}
.admin-project-actions button:hover{border-color:var(--green)}
.admin-data{border-top:1px solid var(--line);margin-top:14px;padding-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.import-button{display:inline-flex;align-items:center;border:1px solid #aeb5a8;border-radius:999px;padding:11px 15px;font-size:11px;font-weight:700;cursor:pointer}
.import-button input{display:none}
.admin-empty{color:var(--muted);font-size:12px;padding:20px 0;text-align:center}

/* Upload zones */
.upload-zone{border:2px dashed #c9cec3;border-radius:10px;padding:16px;text-align:center;background:#fbfbf6;cursor:pointer;transition:.2s;margin-top:6px;position:relative}
.upload-zone:hover,.upload-zone.drag{border-color:var(--green);background:#f0f4ee}
.upload-zone input{display:none}
.upload-zone .uz-icon{font-size:24px;line-height:1;margin-bottom:6px}
.upload-zone .uz-text{font-size:11px;color:#596257;font-weight:600}
.upload-zone .uz-hint{font-size:10px;color:var(--muted);margin-top:2px}
.upload-preview{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.upload-preview .thumb{position:relative;width:70px;height:70px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#eee}
.upload-preview .thumb img{width:100%;height:100%;object-fit:cover}
.upload-preview .thumb .rm{position:absolute;right:2px;top:2px;background:rgba(0,0,0,.7);color:#fff;border:0;width:18px;height:18px;border-radius:50%;font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center}
.upload-file{display:flex;align-items:center;gap:10px;padding:10px;background:#f5f5ee;border-radius:8px;margin-top:8px;font-size:11px}
.upload-file .ficon{font-size:22px}
.upload-file .fname{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-file .frm{border:0;background:none;color:#8b493b;cursor:pointer;font-size:11px;font-weight:700}
.progress{height:3px;background:#e7e5dc;border-radius:2px;overflow:hidden;margin-top:5px}
.progress i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}

/* Champs modale détail admin */
.modal-editor{position:fixed;inset:0;z-index:80;background:rgba(18,28,21,.78);backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-editor.open{display:flex}
.editor-box{background:var(--paper);border-radius:16px;width:min(900px,100%);margin:auto;box-shadow:0 30px 100px #0006;animation:panelIn .3s ease;max-height:92vh;display:flex;flex-direction:column}
.editor-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex:none}
.editor-head h3{margin:0;font:700 18px Manrope,sans-serif}
.editor-scroll{overflow-y:auto;padding:20px 24px;flex:1}
.editor-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex:none;background:var(--paper)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes panelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:900px){
 .admin-columns{grid-template-columns:1fr}
 .detail-hero{height:220px}
 .detail-body{padding:20px}
}
@media(max-width:850px){
 .hero-grid{grid-template-columns:1fr;gap:30px}
 .artboard{max-width:480px;width:100%;margin:auto;min-height:350px}
 .projects{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:580px){
 .wrap{width:calc(100% - 32px)}
 .nav{height:67px}.navlinks{display:none}
 .projects{grid-template-columns:1fr}
 .section{padding:60px 0}
 .admin-overlay{padding:8px}
 .admin-panel{padding:16px}
}
</style>
</head>
<body>
<div class="announcement"><div class="wrap"><span><b>ATELIER TOUNGARA</b> &nbsp;·&nbsp; Des créations numériques, sans détour.</span><span>Fait avec curiosité. Partagé avec soin.</span></div></div>
<header><div class="wrap nav">
<a class="brand" href="#accueil"><span class="brandmark">AT.</span><span>ATELIER TOUNGARA<small>PROJETS & RESSOURCES NUMÉRIQUES</small></span></a>
<nav class="navlinks"><a href="#projets">Les projets</a><a href="#demarche">Notre démarche</a><a href="#contact">Contact</a></nav>
<a class="navbutton" href="#projets">Explorer <span class="arrow">↗</span></a>
</div></header>
<main id="accueil">
<section class="hero"><div class="wrap hero-grid">
<div class="reveal">
<div class="eyebrow">Un atelier d'idées en mouvement</div>
<h1>Des
